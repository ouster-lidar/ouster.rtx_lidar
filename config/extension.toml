[package]
title = "Ouster Lidar RTX"
version = "1.0.0"  # Semantic Versioning is used: https://semver.org/
description = "An extension by Ouster which enables virtual sensor through IsaacSim."
category = "Virtual Sensor"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["ouster", "lidar", "extension"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/ouster-isaacsim-ext"  # URL of the extension source repository


[dependencies]
"omni.kit.uiapp" = {}
"omni.replicator.core" = {}
"isaacsim.sensors.rtx" = {}
"omni.sensors.nv.lidar" = {}
"omni.graph.core" = {}
"omni.graph.tools" = {}

[settings]

# Watch the .ogn files for hot reloading (only works for Python files)
[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import ouster.rtx_lidar"
name = "ouster.rtx_lidar"


[python.pip]
requirements = [
    "ouster.sdk==0.16.1"
]


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
]

args = [
]
